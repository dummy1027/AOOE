<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101019" />
    <title>어둠 속 탈출</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="game-header">
        <div><p class="eyebrow">P5.JS WEB GAME</p><h1>어둠 속 탈출</h1></div>
        <button id="restart-button" type="button">처음부터</button>
      </header>
      <section class="game-frame" aria-label="게임 화면">
        <div id="game-canvas"></div>
        <div id="game-status" class="game-status" aria-live="polite"></div>
      </section>
      <section class="instructions" aria-label="조작 안내">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span>
        <span><kbd>E</kbd> 조사 / 문 열기</span><span><kbd>R</kbd> 다시 시작</span>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
